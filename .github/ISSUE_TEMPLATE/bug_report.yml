name: Bug Report
description: Create a report to help us improve or fix something
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Join our Discord: https://discord.gg/JJXgjd9F6b
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Write a short and concise description of your bug.
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: What did you do to make this happen?
      placeholder: |
        1. Using ...
        2. Do ...
        3. Then use ...
        4. See error
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: If you have any other context about the problem such as screenshots or videos? Add them here.
  - type: input
    id: updated
    attributes:
      label: Current Version
      description: What version of the resource are you using?
      placeholder: e.g. v1.3.0, v1.4.0
    validations:
      required: false
